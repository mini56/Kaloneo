name: Build Windows KALONÉO R58 corrections
# R30 adds simple text colors to Scenario, Consigne and Builder text blocks.

on:
  workflow_dispatch:
  push:
    branches:
      - fix-v1-tri-mail-nwtexte-20261010
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-v1-fixes-20261010.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify R47 validated test visuals and readability
        shell: pwsh
        run: |
          node --check src/preload.js
          node --check src/candidate-catalog-preload.js
          node --check src/candidate-transfer-main.js
          node --check src/candidate-person-identity.js
          node --check src/candidate-store-main.js
          node --check src/candidate-catalog-main.js
          node --check scripts/candidate-person-grouping-electron-smoke-main.js
          node --check scripts/candidate-trash-electron-smoke-main.js
          node --check src/main.js
          node --check src/replay-navigation-capture.js
          node --check src/replay-preload.js
          node --check source/js/qcm-runtime.js
          node --check source/js/kaltest-pilot2-runtime.js
          node --check scripts/kaloneo-builder-r48-7-visible-exit-electron-smoke-main.js
          node --check scripts/kaltest-fractions-cloud-electron-smoke-main.js
          node --check scripts/kaloneo-organisation-v1-electron-smoke-main.js
          node --check scripts/kaltest-five-images-guard.js
          node --check scripts/kaltest-five-images-electron-smoke-main.js
          node --check scripts/kaltest-eleven-images-guard.js
          node --check scripts/kaltest-six-more-images-electron-smoke-main.js
          node --check scripts/kaltest-typography-audit-electron-main.js
          node scripts/kaltest-five-images-guard.js
          node scripts/kaltest-eleven-images-guard.js
          $planning = Get-Content source/kaltest/tests/planning-cantine/1.0.0/test.json -Raw | ConvertFrom-Json
          if ($planning.category -ne 'planification') { throw 'Planning encore classé Organisation.' }
          $runtime = Get-Content source/js/qcm-runtime.js -Raw
          if (-not $runtime.Contains("'planification':'Planification'")) { throw 'Libellé Planification absent.' }
          if (-not $runtime.Contains("category !== 'transition'")) { throw 'Transition non exclue des résultats.' }
          $replay = Get-Content src/replay-preload.js -Raw
          if (-not $replay.Contains('transitionPageVisible')) { throw 'Transition non exclue du replay visuel.' }
          $library = Get-Content src/kaloneo-library-main.js -Raw
          if (-not $library.Contains("String(definition.id) === 'planning_cantine' ? 'planification'")) { throw 'Compatibilité ancienne bibliothèque Planning absente.' }
          if (-not $runtime.Contains("id === 'planning_cantine' ? 'planification'")) { throw 'Compatibilité ancien candidat Planning absente.' }
          node --check source/js/admin-bilan-kaloneo.js
          node --check source/js/admin-bilan-runtime.js
          $bilanPage = Get-Content overrides/admin-bilan.html -Raw
          if (-not $bilanPage.Contains('js/admin-bilan-kaloneo.js')) { throw 'Filtre Bilan KALONÉO non chargé.' }
          $bilan = Get-Content source/js/admin-bilan-kaloneo.js -Raw
          if (-not $bilan.Contains("EXCLUDED_IDS=new Set(['fin_parcours','transition_video_f1'])")) { throw 'Fin/transition non exclues du Bilan.' }
          if (-not $bilan.Contains("'planning':['organisation_demenagement','planning_cantine']")) { throw 'Agrégation institutionnelle Planning/Déménagement absente.' }
          if (-not $bilan.Contains('Parcours réalisé : ')) { throw 'Nom du parcours absent du Bilan dynamique.' }
          if (-not $bilan.Contains('stripExcludedFromClone')) { throw 'Export Word ne filtre pas les lignes historiques.' }
          node --check ../kaloneo/test-builder.js
          node --check ../kaloneo/builder-core.js
          node scripts/kaloneo-builder-r48-restaurant-smoke.js
          node scripts/kaloneo-builder-r48-1-layout-smoke.js
          node --check source/js/admin-parcours-builder.js
          $practical = Get-Content source/kaltest/tests/structure-3d-papier/1.0.0/test.json -Raw | ConvertFrom-Json
          if ($practical.category -ne 'activite_pratique') { throw 'Structure 3D absente de la catégorie Activités pratiques.' }
          if ($practical.activityType -ne 'practical') { throw 'Structure 3D non déclarée activité pratique.' }
          if ($practical.scored -ne $false) { throw 'Une activité pratique ne doit pas être notée automatiquement.' }
          if ($practical.allowEmptyCompletion -ne $true) { throw 'La page pratique ne peut pas être validée sans réponse écran.' }
          if ($practical.bilanContributions.Count -ne 5) { throw 'Grille historique Structure 3D incomplète.' }
          $results = Get-Content source/js/qcm-runtime.js -Raw
          if (-not $results.Contains("'activite pratique':'Activités pratiques'")) { throw 'Section Activités pratiques absente de Résultats.' }
          if (-not $results.Contains("grille d’évaluation à compléter dans le Bilan administrateur")) { throw 'Rappel Bilan absent de Résultats pour les activités pratiques.' }
          if (-not $bilan.Contains("'activite pratique':'Activités pratiques'")) { throw 'Section Activités pratiques absente du Bilan.' }
          if (-not $bilan.Contains("EXISTING_ROW_SOURCES=Object.freeze")) { throw 'Mapping Bilan institutionnel absent.' }
          if (-not $bilan.Contains("'organisation':['ranger_stock']")) { throw 'Ranger le stock doit alimenter seul la ligne Gestion logistique.' }
          if (-not $bilan.Contains("'math-enonce':['calculs_commandes_atelier','calculs_poids_volumes']")) { throw 'Agrégation Mathématiques énoncé absente.' }
          if (-not $bilan.Contains("'math-problemes':['horaires_reception_controle','fractions_preparation_lots','conversions_atelier_expedition']")) { throw 'Agrégation Mathématiques problèmes absente.' }
          if (-not $bilan.Contains("'expression':['texte_a_trous_stage_logistique','genre_nombre','paronymes_rapport','dictee_professionnelle']")) { throw 'Agrégation Expression écrite absente.' }
          if (-not $bilan.Contains('installInstitutionalFilter')) { throw 'Filtrage du Bilan institutionnel absent.' }
          if (-not $bilan.Contains('installUnknownSections')) { throw 'Création de section complémentaire absente.' }
          if (-not $bilan.Contains('temps_essais')) { throw 'Conservation des temps individuels du Tri absente.' }
          $bilanPage = Get-Content overrides/admin-bilan.html -Raw
          if ($bilanPage.Contains('<textarea class="ctxt"></textarea>')) { throw 'Zone texte supplémentaire encore présente dans Commentaires.' }
          if (-not $bilan.Contains("Temps de construction : ")) { throw 'Temps de construction Briques absent du détail commentaire.' }
          if (-not $bilan.Contains("+' erreur'+(errors===1?'':'s')")) { throw 'Gestion singulier/pluriel erreurs absente.' }
          if (-not $bilan.Contains("return pct+' % de réussite'")) { throw 'Pourcentage de réussite institutionnel absent.' }
          if (-not $bilan.Contains("const level=errors<=2?'I':errors<=4?'II':'III'")) { throw 'Seuil historique Ranger le stock absent.' }
          if (-not $bilan.Contains("planning.score>=20?'I':planning.score>=17?'II':'III'")) { throw 'Seuil historique Planning 23 points absent.' }
          if ($bilan.Contains('installAutoevaluationSection(tbody)')) { throw 'Autoévaluation encore affichée dans le tableau Bilan.' }
          if (-not $bilan.Contains('summarySelfEvaluation')) { throw 'Autoévaluation non conservée pour la synthèse.' }
          if ($bilan.Contains("detail.textContent='Moyenne : '")) { throw 'Moyenne fractionnaire des erreurs Tri encore affichée.' }
          if (-not $bilan.Contains("progress:'Je pense avoir progressé dans mes compétences de base.'")) { throw 'Libellé autoévaluation savoirs absent.' }
          if (-not $bilan.Contains("stressmessage:'Messagerie : Je me suis senti(e) stressé(e) ou bloqué(e) à certains moments lors de cette activité.'")) { throw 'Libellé autoévaluation messagerie absent.' }
          $stockTest = Get-Content source/kaltest/tests/ranger-stock/1.0.0/test.json -Raw | ConvertFrom-Json
          $puzzleTest = Get-Content source/kaltest/tests/gratte-ciel/1.0.0/test.json -Raw | ConvertFrom-Json
          if ($stockTest.presentation.legacyFullPage -ne $true) { throw 'Stock non configuré en bloc pleine page.' }
          if ($stockTest.presentation.builderContent.Count -ne 1 -or $stockTest.presentation.builderContent[0].preset -ne 'stock-legacy-v1') { throw 'Stock doit utiliser un seul bloc HTML+JS historique.' }
          if ($puzzleTest.presentation.legacyFullPage -ne $true) { throw 'Puzzle non configuré en bloc pleine page.' }
          if ($puzzleTest.presentation.builderContent.Count -ne 1 -or $puzzleTest.presentation.builderContent[0].preset -ne 'gratte-ciel-legacy-v1') { throw 'Puzzle doit utiliser un seul bloc HTML+JS historique.' }
          $legacyRuntime = Get-Content source/js/kaltest-pilot2-runtime.js -Raw
          if (-not $legacyRuntime.Contains("stock-legacy-v1") -or -not $legacyRuntime.Contains("gratte-ciel-legacy-v1")) { throw 'Raccordement historique Stock/Puzzle absent du runtime KALTEST.' }
          if (-not $legacyRuntime.Contains("legacyPageFrame(test, 'stock.html')")) { throw 'KALTEST ne charge pas la vraie page stock.html.' }
          if (-not $legacyRuntime.Contains("legacyPageFrame(test, 'carre.html')")) { throw 'KALTEST ne charge pas la vraie page carre.html.' }
          $stockLegacyJs = Get-Content source/js/stock-page.js -Raw
          $carreLegacyJs = Get-Content source/js/carre-page.js -Raw
          if (-not $stockLegacyJs.Contains("testId:'ranger_stock'") -or -not $stockLegacyJs.Contains("showCorrections")) { throw 'Pont KALTEST Stock incomplet.' }
          if (-not $carreLegacyJs.Contains("testId:'gratte_ciel'") -or -not $carreLegacyJs.Contains("prepareEmbeddedAppearance")) { throw 'Pont KALTEST Gratte-ciel incomplet.' }
          $uiRuntime = Get-Content source/js/seb-ui-runtime.js -Raw
          if (-not $uiRuntime.Contains("get('kaltestEmbed') === '1'")) { throw 'Navigation imbriquée non bloquée dans les pages historiques.' }
          $candidatePage = Get-Content source/kaltest-pilot2.html -Raw
          if (-not $candidatePage.Contains('class="pilot2-brand" src="assets/kaloneo-logo-app.png"')) { throw 'Logo KALONÉO PNG absent de la page de démarrage.' }
          if (-not (Test-Path source/assets/kaloneo-logo-app.png)) { throw 'Fichier PNG du logo KALONÉO absent.' }
          $runtimeBilan = Get-Content source/js/admin-bilan-runtime.js -Raw
          if (-not $runtimeBilan.Contains("filename:base()+'.docx'")) { throw 'Export Bilan non configuré en DOCX.' }
          if (-not $runtimeBilan.Contains('comment:selectedComment')) { throw 'Commentaire institutionnel absent du payload DOCX.' }
          $tail = Get-Content source/js/admin-bilan-runtime-tail.js -Raw
          if (-not $tail.Contains("row.querySelector('.csel')?.value")) { throw 'SEB-IA ne lit pas le commentaire institutionnel sélectionné.' }
          if (-not $tail.Contains('summarySelfEvaluation')) { throw 'Autoévaluation non raccordée à la synthèse.' }
          node --check src/bilan-docx-main.js
          $identityPage = Get-Content source/kaltest-pilot2.html -Raw
          if (-not $identityPage.Contains('for="personIdentifier">N° identifiant')) { throw 'N° identifiant absent de la page d accueil candidat.' }
          if ($identityPage.Contains('sécurité sociale')) { throw 'Ancienne mention sécurité sociale encore présente sur la page d accueil candidat.' }
          $identityRuntime = Get-Content source/js/kaltest-pilot2-runtime.js -Raw
          if (-not $identityRuntime.Contains("^[A-Z0-9]{7}$")) { throw 'Validation alphanumérique 7 caractères absente.' }
          if ($identityRuntime.Contains('7 premiers chiffres du n° de sécurité sociale')) { throw 'Ancien message NIR encore présent dans le runtime candidat.' }
          $personIdentity = Get-Content src/candidate-person-identity.js -Raw
          if (-not $personIdentity.Contains("candidatePersonIdentity")) { throw 'Modèle personId absent.' }
          $catalogPreload = Get-Content src/candidate-catalog-preload.js -Raw
          if (-not $catalogPreload.Contains("candidate-catalog:list-persons")) { throw 'Liste candidats non regroupée par personne.' }
          if (-not $catalogPreload.Contains("Supprimer l’évaluation")) { throw 'Suppression distincte d une évaluation absente.' }
          if (-not $catalogPreload.Contains("Supprimer le candidat")) { throw 'Suppression globale candidat absente.' }
          $main = Get-Content src/main.js -Raw
          if ($main.Contains("'SVG56'") -or $main.Contains([char]34 + "SVG56" + [char]34)) { throw "Mot de passe administrateur codé en clair dans le programme." }
          if (-not $main.Contains("adminSessionDocumentPassword")) { throw "Mot de passe de session Admin non raccordé à la protection Word." }
          $catalog = Get-Content src/candidate-catalog-main.js -Raw
          if (-not $catalog.Contains("decryptBilanDocxBuffer")) { throw "Ouverture transparente du Word protégé absente de l Admin." }

      - name: Verify R48.1 builder layout and immutable Restaurant questions
        run: node scripts/kaloneo-builder-r48-1-layout-smoke.js

      - name: Verify native DOCX package and exported table content
        shell: pwsh
        run: |
          $output = node scripts/bilan-docx-smoke.js
          $output | Write-Host
          $line = $output | Where-Object { $_ -like 'BILAN_DOCX_SMOKE_PATH=*' } | Select-Object -First 1
          $plainLine = $output | Where-Object { $_ -like 'BILAN_DOCX_SMOKE_PLAIN_PATH=*' } | Select-Object -First 1
          if (-not $line) { throw 'Chemin DOCX protégé smoke absent.' }
          if (-not $plainLine) { throw 'Chemin DOCX déchiffré smoke absent.' }
          $docx = $line.Substring('BILAN_DOCX_SMOKE_PATH='.Length)
          $plainDocx = $plainLine.Substring('BILAN_DOCX_SMOKE_PLAIN_PATH='.Length)
          if (-not (Test-Path $docx)) { throw 'Fichier DOCX protégé smoke introuvable.' }
          if (-not (Test-Path $plainDocx)) { throw 'Fichier DOCX déchiffré smoke introuvable.' }
          $header = [System.IO.File]::ReadAllBytes($docx)[0..7]
          if ($header[0] -eq 0x50 -and $header[1] -eq 0x4B) { throw 'Le DOCX stocké est encore lisible sans protection Office.' }
          $zip = "$plainDocx.zip"
          $outDir = "$plainDocx-unpacked"
          Copy-Item $plainDocx $zip -Force
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $outDir -Force
          $xml = Get-Content (Join-Path $outDir 'word/document.xml') -Raw
          if (-not $xml.Contains('III. Réalise la tâche avec de nombreuses erreurs nécessitant un accompagnement.')) { throw 'Commentaire institutionnel absent du DOCX.' }
          if (-not $xml.Contains('33 erreurs')) { throw 'Indicateur 33 erreurs absent du DOCX.' }
          if (-not $xml.Contains("Synthèse de l’évaluation")) { throw "Synthèse absente du DOCX." }
          if (-not $xml.Contains("Autoévaluation du candidat")) { throw "Autoévaluation absente de la synthèse DOCX." }
          if ($xml.Contains("AUTOEVALUATION_TABLE_FORBIDDEN")) { throw "Autoévaluation présente dans le tableau DOCX." }
          Remove-Item $zip -Force
          Remove-Item $outDir -Recurse -Force

      - name: Verify parcours library selection launch options and runtime
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Verify persistent library refreshes bundled migrated tests
        run: node scripts/kaloneo-seed-refresh-smoke.js

      - name: Verify editing an existing library test into a new version
        run: node scripts/kaloneo-edit-existing-test-smoke.js

      - name: Verify reusable KALONEO image library
        run: node scripts/kaloneo-image-library-smoke.js

      - name: Verify ergonomic library deletion and autonomous parcours transfer
        run: node scripts/kaloneo-ergonomics-library-smoke.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify five user-selected exercise images in real Electron
        run: npx electron --no-sandbox scripts/kaltest-five-images-electron-smoke-main.js

      - name: Verify six remaining validated visuals in real Electron
        run: npx electron --no-sandbox scripts/kaltest-six-more-images-electron-smoke-main.js

      - name: Verify candidate typography floor in real Electron
        run: npx electron --no-sandbox scripts/kaltest-typography-audit-electron-main.js

      - name: Verify restored Fractions random cloud in real Electron
        run: npx electron --no-sandbox scripts/kaltest-fractions-cloud-electron-smoke-main.js

      - name: Verify true immutable Organisation V1 in real KALTEST
        run: npx electron --no-sandbox scripts/kaloneo-organisation-v1-electron-smoke-main.js

      - name: Verify edited Organisation V2 in real KALTEST
        run: npx electron --no-sandbox scripts/kaloneo-edit-existing-electron-smoke-main.js

      - name: Verify true candidate preview Exit button and Escape (R48.7)
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-7-visible-exit-electron-smoke-main.js

      - name: Verify Test Builder real Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify Stock and Gratte-ciel historical identity in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-legacy-identity-smoke-main.js

      - name: Verify full-page interactive actions and Admin correction policy
        run: npx electron --no-sandbox scripts/kaloneo-interactive-fullpage-smoke-main.js

      - name: Verify practical activity candidate page in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-practical-activity-electron-smoke-main.js

      - name: Verify dynamic KALONEO Bilan from executed parcours
        run: npx electron --no-sandbox scripts/kaloneo-bilan-dynamic-smoke-main.js

      - name: Verify dynamic final page closes active candidate
        run: npx electron --no-sandbox scripts/kaloneo-final-completion-electron-smoke-main.js

      - name: Verify Admin Bilan keeps vertical scrolling
        run: npx electron --no-sandbox scripts/admin-bilan-windows-smoke.js

      - name: Verify candidate store person and evaluation identity
        run: node scripts/candidate-store-smoke.js

      - name: Verify candidate catalog including parcours name
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify selected candidate encrypted export engine
        run: node scripts/candidate-transfer-smoke.js

      - name: Verify grouped candidate evaluations and export ergonomics in real Electron
        run: npx electron --no-sandbox scripts/candidate-person-grouping-electron-smoke-main.js

      - name: Verify candidate trash empty full restore and purge in real Electron
        run: npx electron --no-sandbox scripts/candidate-trash-electron-smoke-main.js

      - name: Verify selected parcours candidate runtime in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js

      - name: Verify historical full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify Admin bar and current Build number
        run: node scripts/admin-build-label-guard.js

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Verify R48.10 generic equal columns in actual candidate Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js

      - name: Verify consolidated validated features
        run: node scripts/kaloneo-consolidation-regression.js

      - name: Verify selected icon appears on real candidate test in Electron
        run: npx electron --no-sandbox scripts/kaloneo-candidate-icon-electron-smoke-main.js

      - name: Check Builder save with blank image and icons
        run: node scripts/kaloneo-builder-empty-media-regression.js

      - name: Check test portability
        run: node scripts/kaloneo-test-portability-check.js

      - name: Build Windows PILOTE 22 R48.7 setup
        run: npx electron-builder --win nsis --config build/kaloneo-v1-fixes-r58-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R58-0.0.87-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R47 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R47-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R58-0.0.87-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish V1 correction test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-v1-fixes-r58-test'
          $title = 'SEB EvalPro Kalonéo — R58 Correctifs V1 TEST'
          if (gh release view $tag 2>$null) {
            throw 'Release déjà existante ; ne pas écraser une release précédente.'
          }
          $notes = @"
          Version de TEST sur branche isolée fix-v1-tri-mail-nwtexte-20261010.
          Corrections limitées à Traitement de texte (interface / aide de sauvegarde), Tri de chevilles (validation des erreurs), Rédaction d'e-mail (énoncé sans aide).
          Barème Traitement de texte sur 8 inchangé, Résultats et Bilan inchangés.
          Cette version doit être testée avant toute intégration.
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target fix-v1-tri-mail-nwtexte-20261010 --title $title --notes $notes
