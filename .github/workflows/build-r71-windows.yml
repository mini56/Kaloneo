name: 'Build Windows KALONÉO R72 — Build #77 Restaurant V1 (branche existante)'
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - 'kaloneo/test-builder.js'
      - 'kaloneo/test-preview.js'
      - 'kaloneo/builder-core.js'
      - 'seb-evalpro/source/js/kaltest-pilot2-runtime.js'
      - 'seb-evalpro/scripts/kaloneo-restaurant-v1-r70-smoke.js'
      - '.github/workflows/build-r72-windows.yml'
      - 'seb-evalpro/package.json'
      - 'seb-evalpro/build/installer.nsh'
      - 'seb-evalpro/build/kaloneo-v1-fixes-r72-builder.yml'
      - 'seb-evalpro/scripts/full-pilot-journey-smoke-main.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-r72:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout existing branch — Restaurant V1
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unique build gate — no duplicate of the previous published Setup
        shell: pwsh
        run: |
          $p = Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $number = [int]$p.sebBuildNumber
          $nsis = Get-Content -Raw -Encoding UTF8 build/installer.nsh
          $cfg = Get-Content -Raw -Encoding UTF8 build/kaloneo-v1-fixes-r72-builder.yml
          if ($number -ne 77) { throw "R72 doit être Build #77, trouvé #$number." }
          if ($nsis -notmatch '!define SEB_BUILD_NUMBER "77"') { throw 'Numéro NSIS différent de Build #77.' }
          if ($cfg -notmatch 'version: 0\.0\.101') { throw 'Version du paquet R72 incorrecte.' }
          if ($cfg -notmatch 'PILOTE-22-R72-0\.0\.101-Windows-Setup') { throw 'Nom du Setup incohérent.' }
          git fetch --depth=1 origin tag seb-kaloneo-v1-fixes-r71-test
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de lire le tag R69 pour garantir un build distinct.' }
          $previousJson = (git show 'seb-kaloneo-v1-fixes-r71-test:seb-evalpro/package.json') -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de comparer au Build R69.' }
          $previous = $previousJson | ConvertFrom-Json
          if ($number -le [int]$previous.sebBuildNumber) {
            throw "Build réutilisé ou régressif : R69 #$($previous.sebBuildNumber), R72 #$number."
          }
          Write-Host "Numéros validés : R69 Build #$($previous.sebBuildNumber), R72 Build #$number (0.0.101)."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check restored Tri runtime and smoke syntax
        run: |
          node --check source/js/kaltest-pilot2-runtime.js
          node --check scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
          node --check scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: Verify 100 icons in native 96px format
        run: node scripts/verify-r61-icons.js
      - name: Generate historical KALTEST pilot data
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare authentic KALTEST candidate application
        run: npm run prepare:web
      - name: Verify Admin V1 save backups and persistence across app upgrades
        run: node scripts/kaloneo-testsv1-developer-smoke.js
      - name: Check Restaurant export includes the images from installed app/web
        run: node scripts/kaloneo-export-restaurant-r69-smoke.js
      - name: Verify Restaurant v3 promoted to official V1 and upgrade migration
        run: node scripts/kaloneo-restaurant-v1-r70-smoke.js
      - name: Verify original V1 and V2 coexist without delete regression
        run: node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Verify V1 can be modified and saved in the real Electron Builder
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Check Tri first attempt error and next chrono in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
      - name: Check 125+ Briques errors and admin save in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: Check full candidate parcours transitions in real Electron
        id: full_journey
        continue-on-error: true
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Check selected parcours execution in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js
      - name: Check validated NWTEXT exercise in real Electron
        run: npx electron --no-sandbox scripts/nwtexte-functional-smoke-main.js
      - name: Check e-mail exercise in real Electron
        run: npx electron --no-sandbox scripts/nvmail-functional-smoke-main.js
      - name: Check dynamic evaluation results and Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-bilan-dynamic-smoke-main.js
      - name: Check validated Builder R48.10 auto columns in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js
      - name: Check test icons in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-candidate-icon-electron-smoke-main.js
      - name: Check preserved validated R48.10 / NWTEXT R55 / icons
        run: node scripts/kaloneo-consolidation-regression.js
      - name: Final gate - do not mask any full journey regression
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.full_journey.outcome }}' -ne 'success') {
            throw 'Parcours complet non valide : la publication reste bloquee, meme si les autres controles passent.'
          }
      - name: Build Windows Setup R72
        run: npx electron-builder --win nsis --config build/kaloneo-v1-fixes-r72-builder.yml --publish never

      - name: Verify R72 Setup and calculate SHA256
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R72-0.0.101-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup R72 introuvable apres compilation.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R72 Setup : $($setup.Name) SHA256=$hash"

      - name: Upload R72 Setup as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R72-Windows-Setup
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R72-0.0.101-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release R72 (do not overwrite previous releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-v1-fixes-r72-test'
          $title = 'SEB EvalPro Kalonéo — R72 / Build #77 — Restaurant V1 validé — TEST'
          if (gh release view $tag 2>$null) {
            throw 'Release R72 deja presente : ne pas ecraser une release existante.'
          }
          $notes = @"
          R72 VERSION DE TEST - Build #77 / version 0.0.101. Base R71 / Build #76 ; fonction unique : redimensionnement des images dans les blocs du Builder.
          - Image 10 à 100 %, boutons + / − / 100 %, aperçu et affichage candidat, persistance.
          - Aucun test catalogue modifié, mêmes contrôles de non-régression.
          SHA256 Setup : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target $env:GITHUB_SHA --title $title --notes $notes
