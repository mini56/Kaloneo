name: "KALONÉO R176 - Corriger images sur PC existant, Puzzle et Import / Export"
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/audit-r176-final-setup.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kaloneo-r176-data-protection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dpapi-cross-process:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local Electron runtime
        run: npm install --no-audit --no-fund
      - name: Seed DPAPI and real encrypted candidate folders under isolated Windows profile
        shell: pwsh
        run: |
          $env:KALONEO_R172_MANIFEST=Join-Path $env:RUNNER_TEMP 'r176-dpapi-roundtrip.json'
          & npx electron --no-sandbox scripts/r172-update-fixture-electron-main.js --seed
          if($LASTEXITCODE -ne 0){throw 'Original DPAPI encryption failed'}
          & npx electron --no-sandbox scripts/r172-update-fixture-electron-main.js --verify
          if($LASTEXITCODE -ne 0){throw 'Cross-process Windows DPAPI cannot reopen a candidate: stop the build'}
  audit-real-upgrade-windows:
    needs: dpapi-cross-process
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: seb-evalpro
    env:
      KALONEO_SKIP_OFFICIAL_V1: '0'
      KALONEO_STRICT_RENDER_IMAGES: '1'
      KALONEO_STRICT_INTRO_VIDEO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original KALONEO artwork and video optimized without changes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
          python scripts/kaloneo-r125-branding.py
          python scripts/r158-build-installer-intro.py
          node scripts/r158-installer-intro-smoke.js
          node scripts/r169-installer-animation-smoke.js
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare official KALTEST seeds (git network timeout 120s)
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=BUILD_KALTEST_DATA'
          node scripts/build-kaltest-pilot2-data.js
          if($LASTEXITCODE -ne 0){throw 'Synchronisation V1 interrompue ou impossible'}
      - name: Generate candidate pages and optimized media
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=PREPARE_WEB'
          npm run prepare:web
          if($LASTEXITCODE -ne 0){throw 'Preparation des pages impossible'}
      - name: Verify data safety and uninstall rules
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=DATA_SAFETY'
          node scripts/kaloneo-full-uninstall-policy.js
          if($LASTEXITCODE -ne 0){throw 'Conservation des donnees invalide'}
          node scripts/candidate-local-protection-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Protection DPAPI invalide'}
          node scripts/candidate-loss-prevention-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Export/import de candidats invalide'}
      - name: Verify video, masks and official legacy presentation
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=VISUAL_REGRESSIONS'
          node scripts/r170-intro-video-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Regression video'}
          node scripts/kaloneo-genre-nombre-font-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Regression Genre Nombre'}
          node scripts/r162-static-mask-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Ecran de masquage manquant'}
      - name: Verify math grids and old installed V1 upgrade
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=GRID_UPGRADE'
          node scripts/kaloneo-number-grid-v1-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Barèmes des grilles invalides'}
          node scripts/kaloneo-math-grid-upgrade-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Une ancienne V1 locale ne récupère pas ses illustrations'}
      - name: Electron Import / Export alignment 1366 and 1200
        shell: pwsh
        run: |
          Write-Host 'R176_PHASE=IMPORT_EXPORT'
          & npx electron --no-sandbox scripts/r175-import-export-layout-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Import / Export non aligne'}
      - name: "R176 gates - full licence, NSIS 6155 guard, square grids and Puzzle Electron 1200/1366"
        shell: pwsh
        run: |
          node scripts/r174-license-about-nsis-smoke.js
          if($LASTEXITCODE -ne 0){throw 'KALONEO licence regression'}
          node scripts/kaloneo-number-grid-v1-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Number grid V1 regression'}
          & npx electron --no-sandbox scripts/kaloneo-number-grid-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Real Electron 40/60 grid regression'}
          & npx electron --no-sandbox scripts/r173-puzzle-example-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Real Electron Puzzle example regression'}
      - name: Patch pinned NSIS directory-page callbacks only
        run: node scripts/kaloneo-nsis-directory-template.js
      - name: Build unpublished R176 test installer, Build #179 unique
        run: npx electron-builder --win nsis --config build/kaloneo-r176-final-setup.yml --publish never
      - name: Retrieve real published R175 installer for migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/previous -Force | Out-Null
          gh release download seb-kaloneo-r175-import-export-images-layout-test --pattern 'KALONEO-Setup-0.0.202.exe' --dir dist/previous --clobber
          if($LASTEXITCODE -ne 0 -or -not(Test-Path dist/previous/KALONEO-Setup-0.0.202.exe)){throw 'Baseline R175 setup missing'}
      - name: REAL Windows R175 to R176 upgrade, DPAPI candidate and Word preservation, default uninstall, reinstall, forbidden switch
        shell: pwsh
        run: |
          & ./scripts/r176-real-upgrade-windows-smoke.ps1 -PreviousSetup (Resolve-Path dist/previous/KALONEO-Setup-0.0.202.exe) -NewSetup (Resolve-Path dist/KALONEO-Setup-0.0.203.exe)
          if($LASTEXITCODE -ne 0){throw 'R176 real upgrade lost candidate or builder data'}
      - name: Validate full R60 V1 regression on the exact commit before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline=(Get-Date).AddMinutes(18)
          do {
            $runs=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'V1 regression status unavailable'}
            $matches=@($runs.workflow_runs | Where-Object { $_.name -eq 'R60 V1 Admin edit and Tri cross-regression' })
            if($matches.Count -gt 0){
              $latest=$matches | Sort-Object created_at -Descending | Select-Object -First 1
              if($latest.conclusion -eq 'success'){Write-Host 'R60 V1 REGRESSION=SUCCESS on exact commit';break}
              if($latest.conclusion -in @('failure','cancelled','timed_out','action_required')){throw 'R60 V1 failed; R176 Setup publication blocked'}
            }
            if((Get-Date) -gt $deadline){throw 'R60 not confirmed GREEN; no publication'}
            Start-Sleep -Seconds 20
          }while($true)
      - name: Publish single R176 Build 179 Windows Setup after all tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='seb-kaloneo-r176-verified-image-upgrade-puzzle-test'
          if(gh release view $tag 2>$null){throw 'R176 Setup already published; never reuse a build'}
          $item=Get-Item 'dist/KALONEO-Setup-0.0.203.exe'
          if(-not $item -or $item.Length -lt 40MB){throw 'Windows Setup missing or unexpectedly small'}
          $hash=(Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToUpperInvariant()
          $title='KALONÉO — R176 / Build #179 — images après mise à jour, Puzzle et Import / Export'
          $notes=@"
          KALONÉO R176 / Build #179 / 0.0.203 — Setup Windows de test.
          - Migration réelle des anciennes définitions locales des deux grilles après upgrade : illustrations récupérées, grille 60 % à droite, aucun autre test modifié.
          - Bouton Puzzle harmonisé avec les boutons blancs à bord bleu KALONÉO ; focus et fenêtre secondaire préservés.
          - Fenêtre Import / Export : alignement des commandes avec Tests / Parcours, « Export ZIP » en bleu.
          - Résultats confirmés par les contrôles Electron 1366 et 1200 et le test simulant une installation ancienne.
          - Deux illustrations adultes intégrées sur fonds bleu clair 40/60 et grilles carrées agrandies.
          - Bouton « Voir l’exemple » dans le premier bloc bleu du Puzzle Gratte-ciel ; ouvre une fenêtre secondaire interne avec l'image fournie, sans perte des saisies ni du chronomètre.
          - Fenêtre secondaire accessible au clavier, Fermer restaure le focus ; PNG externe de 123 Ko, non dupliqué dans le JSON.
          - Deux nouvelles V1 construites avec les grilles du Builder : Grille d’opérations (2 solutions admises) et Carré magique 15 (8 solutions admises), neuf points chacune.
          - Genre et nombre V1 : deux blocs bleu clair et image bandeau.
          - Descriptions de la page Tests / Parcours raccourcies, bibliothèque d'images.
          - Licence complète consultable dans À propos et acceptation explicite par case initialement non cochée dans le Setup.
          - Puzzle « Voir l’exemple » : bouton bleu KALONÉO à droite, fenêtre secondaire accessible.
          - Deux nouveaux tests V1 : images à gauche 40 %, grilles carrées à droite 60 %, calculatrice activée.
          - Conservation des données et clés de chiffrement lors de mise à jour R175 → R176, désinstallation et réinstallation.
          - Publication conditionnée aux contrôles stricts R60 V1 et Puzzle Electron sur exactement le même commit.
          SHA256: $hash
          Commit: $env:GITHUB_SHA
          "@
          gh release create $tag $item.FullName --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'GitHub Release failed — Setup not published'}
