name: "KALONÉO R172 - Audit réel des données à l'installation et désinstallation"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kaloneo-r172-data-protection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dpapi-cross-process:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local Electron runtime
        run: npm install --no-audit --no-fund
      - name: Seed DPAPI and real encrypted candidate folders under isolated Windows profile
        shell: pwsh
        run: |
          $env:KALONEO_R172_MANIFEST=Join-Path $env:RUNNER_TEMP 'r172-dpapi-roundtrip.json'
          & npx electron --no-sandbox scripts/r172-update-fixture-electron-main.js --seed
          if($LASTEXITCODE -ne 0){throw 'Original DPAPI encryption failed'}
          & npx electron --no-sandbox scripts/r172-update-fixture-electron-main.js --verify
          if($LASTEXITCODE -ne 0){throw 'Cross-process Windows DPAPI cannot reopen a candidate: stop the build'}
  audit-real-upgrade-windows:
    needs: dpapi-cross-process
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: seb-evalpro
    env:
      KALONEO_SKIP_OFFICIAL_V1: '0'
      KALONEO_STRICT_RENDER_IMAGES: '1'
      KALONEO_STRICT_INTRO_VIDEO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original KALONEO artwork and video optimized without changes
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
          python scripts/kaloneo-r125-branding.py
          python scripts/r158-build-installer-intro.py
          node scripts/r158-installer-intro-smoke.js
          node scripts/r169-installer-animation-smoke.js
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build candidate pages and validate existing core
        shell: pwsh
        run: |
          node scripts/build-kaltest-pilot2-data.js
          npm run prepare:web
          if($LASTEXITCODE -ne 0){throw 'Preparation failed'}
          node scripts/kaloneo-full-uninstall-policy.js
          if($LASTEXITCODE -ne 0){throw 'Default-preservation policy invalid'}
          node scripts/r170-intro-video-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Video regression'}
          node scripts/candidate-local-protection-smoke.js
          if($LASTEXITCODE -ne 0){throw 'DPAPI protection regression'}
          node scripts/candidate-loss-prevention-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Candidate import/export regression'}
          node scripts/kaloneo-genre-nombre-font-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Deux tableaux V1 et bandeau pleine largeur perdus'}
          node scripts/r162-static-mask-smoke.js
          if($LASTEXITCODE -ne 0){throw 'Écran de masquage image fixe du parcours de base perdu'}
      - name: Patch pinned NSIS directory-page callbacks only
        run: node scripts/kaloneo-nsis-directory-template.js
      - name: Build unpublished R172 test installer, Build #175 unique
        run: npx electron-builder --win nsis --config build/kaloneo-r172-data-preservation.yml --publish never
      - name: Retrieve real published R171 installer for migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/previous -Force | Out-Null
          gh release download seb-kaloneo-r171-video-heading-cleanup-test --pattern 'KALONEO-Setup-0.0.198.exe' --dir dist/previous --clobber
          if($LASTEXITCODE -ne 0 -or -not(Test-Path dist/previous/KALONEO-Setup-0.0.198.exe)){throw 'Baseline R171 setup missing'}
      - name: REAL Windows R171 to R172 upgrade, DPAPI candidate and Word preservation, default uninstall, reinstall, forbidden switch
        shell: pwsh
        run: |
          & ./scripts/r172-real-upgrade-windows-smoke.ps1 -PreviousSetup (Resolve-Path dist/previous/KALONEO-Setup-0.0.198.exe) -NewSetup (Resolve-Path dist/KALONEO-Setup-0.0.199.exe)
          if($LASTEXITCODE -ne 0){throw 'R172 real upgrade lost candidate or builder data'}
      - name: Validate full R60 V1 regression on the exact commit before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline=(Get-Date).AddMinutes(18)
          do {
            $runs=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'V1 regression status unavailable'}
            $matches=@($runs.workflow_runs | Where-Object { $_.name -eq 'R60 V1 Admin edit and Tri cross-regression' })
            if($matches.Count -gt 0){
              $latest=$matches | Sort-Object created_at -Descending | Select-Object -First 1
              if($latest.conclusion -eq 'success'){Write-Host 'R60 V1 REGRESSION=SUCCESS on exact commit';break}
              if($latest.conclusion -in @('failure','cancelled','timed_out','action_required')){throw 'R60 V1 failed; R172 Setup publication blocked'}
            }
            if((Get-Date) -gt $deadline){throw 'R60 not confirmed GREEN; no publication'}
            Start-Sleep -Seconds 20
          }while($true)
      - name: Publish single R172 Build 175 Windows Setup after all tests
        # Workflow historique : conserver les audits, interdire toute publication.
        if: ${{ false }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='seb-kaloneo-r172-data-preservation-builder-test'
          if(gh release view $tag 2>$null){throw 'R172 Setup already published; never reuse a build'}
          $item=Get-Item 'dist/KALONEO-Setup-0.0.199.exe'
          if(-not $item -or $item.Length -lt 40MB){throw 'Windows Setup missing or unexpectedly small'}
          $hash=(Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToUpperInvariant()
          $title='KALONÉO — R172 / Build #175 — Conservation candidats et correctifs Builder'
          $notes=@"
          KALONÉO R172 / Build #175 / 0.0.199 — Setup Windows de test.
          - Désinstallation normale : conservation des données candidats, parcours, bilans et clés. Effacement définitif uniquement sur demande avec double avertissement.
          - Audit réel Windows R171 -> R172, désinstallation et réinstallation, 27 fichiers SHA256 identiques, clé DPAPI utilisable, deux dossiers candidats et bilan général retrouvés.
          - Parcours de base : écran de masquage KALONÉO — image fixe.
          - Éditeur de masque : bouton Fermer au lieu de Tests/Parcours.
          - Bibliothèque : clarification du message de regroupement des images.
          - Miniature Builder : retrait de la ligne Exercice 1/1 sans toucher au candidat.
          - Genre et nombre : permettre de conserver deux fonds colorés et une image en bandeau pleine largeur, sans altérer les 20 questions de la V1.
          - Régressions V1 et Tri R60 exigées vertes sur exactement ce commit.
          SHA256: $hash
          Commit: $env:GITHUB_SHA
          "@
          gh release create $tag $item.FullName --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          if($LASTEXITCODE -ne 0){throw 'GitHub Release failed — Setup not published'}
