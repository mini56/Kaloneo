name: "KALONÉO R124 - Débordement réel et résolutions - Build 129"
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/build-r124-responsive-overflow.yml'

concurrency:
  group: kaloneo-r124-setup-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout original existing branch
        uses: actions/checkout@v4

      - name: Prove successful audit, unique Build #129 and unchanged V1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $auditSha='c9822bf38818dcb06000f5eb717da816e973fd13'
          $auditRun=gh api repos/mini56/SEB-EVAL-PRO-Kaloneo/actions/runs/39048935565 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $auditRun.conclusion -ne 'success' -or $auditRun.head_sha -ne $auditSha) { throw 'Audit R124 multi-ecrans non valide.' }
          git fetch --depth=15 origin fix-r60-tri-rearm-only-20261011
          if ($LASTEXITCODE -ne 0) { throw 'Historique de la branche indisponible.' }
          $allowed=@('seb-evalpro/package.json','seb-evalpro/build/installer.nsh','seb-evalpro/build/kaloneo-v1-fixes-r124-responsive-overflow.yml','.github/workflows/build-r124-responsive-overflow.yml')
          foreach ($file in (git diff --name-only $auditSha HEAD)) {
            if ($file -notin $allowed) { throw "Modification non auditée depuis le run vert: $file" }
          }
          git fetch --depth=1 origin tag seb-kaloneo-r123-free-text-height-test
          if ($LASTEXITCODE -ne 0) { throw 'R123 secours introuvable.' }
          $old=(git show 'seb-kaloneo-r123-free-text-height-test:seb-evalpro/package.json') -join [Environment]::NewLine | ConvertFrom-Json
          $current=Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $nsis=Get-Content -Raw -Encoding UTF8 build/installer.nsh
          $config=Get-Content -Raw -Encoding UTF8 build/kaloneo-v1-fixes-r124-responsive-overflow.yml
          if ([int]$old.sebBuildNumber -ne 128 -or [int]$current.sebBuildNumber -ne 129) { throw 'Numero Build deja employe ou hors sequence.' }
          if ([string]$current.sebReleaseVersion -ne '0.0.153') { throw 'Version R124 incorrecte.' }
          if ($nsis -notmatch '!define SEB_BUILD_NUMBER "129"') { throw 'Numero installateur incoherent.' }
          if ($config -notmatch 'version: 0\.0\.153' -or $config -notmatch 'PILOTE-22-R124-0\.0\.153-Windows-Setup') { throw 'Nom Setup ou version incoherents.' }
          $existing=git ls-remote --tags origin 'refs/tags/seb-kaloneo-r124-responsive-overflow-test'
          if ($LASTEXITCODE -ne 0 -or $existing) { throw 'Tag R124 deja utilise, aucun Build relance.' }
          Write-Host 'R124 Build 129 inedit, code audite et R123 secours preserve.'

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax and generic clipping guard
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/kaloneo-layout-diagnostics.js
          node --check ../kaloneo/test-builder.js
          node --check scripts/kaloneo-responsive-overflow-electron-smoke-main.js
          node scripts/kaloneo-layout-diagnostics-unit-smoke.js
          node scripts/admin-build-label-guard.js
          node scripts/kaloneo-builder-future-roundtrip-smoke.js
          node scripts/kaloneo-answer-layout-roundtrip-smoke.js
          node scripts/kaloneo-units-score-audit-smoke.js
          node scripts/kaloneo-catalog-roundtrip-score-guard.js
          node scripts/kaloneo-free-text-height-r123-smoke.js
          node scripts/kaloneo-image-export-ui-smoke.js
          node scripts/kaloneo-image-library-smoke.js
      - name: Prepare full historical journey
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Build web application and all architecture guards
        run: npm run prepare:web
      - name: Check KALTEST export and V1 immutability
        shell: pwsh
        run: |
          node scripts/kaloneo-export-restaurant-r69-smoke.js
          node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Electron - five responsive resolutions and unreachable overflow
        run: npx electron --no-sandbox scripts/kaloneo-responsive-overflow-electron-smoke-main.js
      - name: Electron - Builder focus and faithful candidate preview
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Electron - brand new questions, image and tables
        run: npx electron --no-sandbox scripts/kaloneo-new-test-preview-electron-smoke-main.js
      - name: Electron - common columns and score layout
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js
      - name: Electron - result data separated across candidate tests
        run: npx electron --no-sandbox scripts/kaloneo-results-strict-isolation-electron-smoke-main.js
      - name: Electron - full readable results and bilan
        run: npx electron --no-sandbox scripts/kaloneo-results-readable-formats-electron-smoke-main.js
      - name: Electron - full original candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Verify transfer and storage persistence
        run: npm run test:security
      - name: Compile only after all checks pass
        run: npx electron-builder --win nsis --config build/kaloneo-v1-fixes-r124-responsive-overflow.yml --publish never
      - name: Compute setup SHA256
        shell: pwsh
        run: |
          $setup=Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R124-0.0.153-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup R124 Build 129 absent.' }
          $hash=(Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R124 Build #129 SHA256=$hash"
      - name: Preserve installer artifact for Windows trial
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-R124-Build-129-Setup
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R124-0.0.153-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish unique R124 test prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='seb-kaloneo-r124-responsive-overflow-test'
          if (gh release view $tag 2>$null) { throw 'Release deja publiee: aucun recyclage du Build 129.' }
          $title='SEB EvalPro Kaloneo - R124 / Build #129 - DEBORDEMENT ET RESOLUTIONS A TESTER'
          $notes=@"
          R124 / Build #129 / v0.0.153 — POUR ESSAIS WINDOWS.
          - Controle generique des contenus reellement coupes, sans alarme sur les colonnes defilables.
          - Miniature Electron 1366 x 768 conservee, aucun rendu V1 retouche.
          - Validations reelles Electron 1200x800, 1280x720, 1366x768, 1600x900, 1920x1080.
          - Test de bloc volontairement inaccessible et de tableaux defilables.
          - Parcours complet, Builder, resultats, notation, images et import/export controles.
          - Aucune V1 validee ni image historique modifiee.
          - Version precedente R123 Build #128 conservee pour secours.
          Audit R124: https://github.com/mini56/SEB-EVAL-PRO-Kaloneo/actions/runs/39048935565
          SHA256: $env:SETUP_SHA256
          Commit: $env:GITHUB_SHA
          "@
          gh release create $tag "$env:SETUP_PATH" --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
