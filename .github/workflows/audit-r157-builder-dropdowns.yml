  push:
    branches: [fix-r60-tri-rearm-only-20261011]
    paths:
      - '.github/workflows/audit-r157-builder-dropdowns.yml'
      - '.github/workflows/build-r157-builder-menus.yml'
      - '.github/workflows/build-r158-installer-video-intro.yml'
      - '.github/workflows/build-r159-clean-kaloneo-five-tests.yml'
      - '.github/workflows/build-r160-original-v1.yml'
      - '.github/workflows/build-r161-lazy-mask.yml'
      - 'seb-evalpro/src/preload.js'
      - 'seb-evalpro/src/kaloneo-library-main.js'
      - 'seb-evalpro/scripts/prepare-web.js'
      - 'seb-evalpro/scripts/kaloneo-r125-branding.py'
      - 'seb-evalpro/package.json'
      - '.github/workflows/build-r162-compact-five-static-mask.yml'
      - '.github/workflows/build-r163-library-pages.yml'
      - '.github/workflows/build-r164-presentation-icons.yml'
      - '.github/workflows/build-r165-visuals-installer.yml'
      - '.github/workflows/build-r166-builder-fast-open.yml'
      - '.github/workflows/build-r167-hd-images-preview.yml'
      - '.github/workflows/build-r168-test-image-optimization.yml'
      - '.github/workflows/build-r169-installer-video-fluid.yml'
      - '.github/workflows/build-r170-new-parcours-intro-video.yml'
      - '.github/workflows/build-r171-video-heading-cleanup.yml'
      - 'seb-evalpro/scripts/r170-optimize-intro-video.py'
      - 'seb-evalpro/scripts/r170-intro-video-smoke.js'
      - 'seb-evalpro/source/js/kaltest-pilot2-intro-video.js'
      - 'seb-evalpro/source/kaltest-pilot2.html'
      - 'seb-evalpro/scripts/r169-installer-animation-smoke.js'
      - 'seb-evalpro/scripts/r158-build-installer-intro.py'
      - 'seb-evalpro/scripts/r158-installer-intro-smoke.js'
      - 'seb-evalpro/scripts/r168-test-image-performance-smoke.js'
      - 'seb-evalpro/scripts/optimize-test-image-assets.py'
      - 'seb-evalpro/src/kaloneo-render-image-cache.js'
      - 'seb-evalpro/scripts/prepare-web.js'
      - 'seb-evalpro/scripts/r167-hd-preview-smoke.js'
      - 'seb-evalpro/source/js/kaltest-pilot2-runtime.js'
      - 'seb-evalpro/source/css/kaltest-pilot2.css'
      - 'seb-evalpro/scripts/r166-builder-open-performance-smoke.js'
      - 'kaloneo/test-preview.css'
      - 'kaloneo/test-builder.css'
      - 'seb-evalpro/scripts/r165-visual-smoke.js'
      - 'seb-evalpro/scripts/r164-presentation-icons-smoke.js'
      - 'seb-evalpro/scripts/kaloneo-candidate-icon-electron-smoke-main.js'
      - 'seb-evalpro/src/kaloneo-default-test-icons.js'
      - 'seb-evalpro/scripts/supplied-images-library-smoke.js'
      - 'seb-evalpro/scripts/builder-special-parcours-pages-smoke.js'
      - 'seb-evalpro/scripts/r162-static-mask-smoke.js'
      - 'seb-evalpro/scripts/r162-compact-five-smoke.js'
      - 'seb-evalpro/src/kaloneo-v1-image-assets.js'
      - 'seb-evalpro/scripts/r159-clean-install-windows-smoke.ps1'
      - 'seb-evalpro/scripts/kaloneo-testsv1.js'
      - 'seb-evalpro/build/installer.nsh'
      - 'seb-evalpro/scripts/kaloneo-r126-install-path-guard.js'
      - 'seb-evalpro/scripts/r158-build-installer-intro.py'
      - 'seb-evalpro/scripts/r158-installer-intro-smoke.js'
      - 'kaloneo/test-builder.js'
      - 'kaloneo/test-builder.css'
      - 'kaloneo/test-builder.html'
      - 'kaloneo/builder-core.js'
      - 'seb-evalpro/scripts/kaloneo-builder-preview-electron-smoke-main.js'
  workflow_dispatch:
concurrency:
  group: kaloneo-r157-dropdown-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  builder-menus:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout same established work branch
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare 22 original candidate tests and official Builder web pages
        run: |
          node scripts/build-kaltest-pilot2-data.js
          npm run prepare:web
      - name: Audit V1 real Electron selects, dropdown hit targets and color persistence
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
