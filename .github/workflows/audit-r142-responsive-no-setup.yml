name: "KALONÉO R142 - Audit affichage et non-régression (sans Setup)"
on:
  push:
    branches: [fix-r60-tri-rearm-only-20261011]
    paths:
      - 'seb-evalpro/src/kaloneo-layout-diagnostics.js'
      - 'kaloneo/test-builder.js'
      - 'kaloneo/test-builder.html'
      - 'kaloneo/test-builder.css'
      - 'seb-evalpro/package.json'
      - 'seb-evalpro/build/kaloneo-r142-responsive.yml'
      - 'seb-evalpro/build/kaloneo-r143-confidentialite.yml'
      - 'seb-evalpro/build/kaloneo-r144-bilan-courant.yml'
      - '.github/workflows/build-r144-kaloneo-bilan-courant.yml'
      - '.github/workflows/build-r143-kaloneo-confidentialite.yml'
      - '.github/workflows/build-r142-kaloneo-responsive.yml'
      - 'seb-evalpro/src/main.js'
      - 'seb-evalpro/src/replay-main.js'
      - 'seb-evalpro/scripts/candidate-private-pending-smoke.js'
      - 'seb-evalpro/src/replay-archive-integrity.js'
      - 'seb-evalpro/src/candidate-data-crypto.js'
      - 'seb-evalpro/src/candidate-transfer-main.js'
      - 'seb-evalpro/src/candidate-folder-utils.js'
      - 'seb-evalpro/src/candidate-store-main.js'
      - 'seb-evalpro/scripts/candidate-deletion-index-privacy-smoke.js'
      - 'seb-evalpro/src/candidate-anonymous-paths.js'
      - 'seb-evalpro/scripts/candidate-forward-anonymity-smoke.js'
      - 'seb-evalpro/src/candidate-catalog-main.js'
      - 'seb-evalpro/scripts/candidate-word-privacy-guard.js'
      - 'seb-evalpro/src/candidate-private-documents.js'
      - 'seb-evalpro/src/candidate-protected-download.js'
      - 'seb-evalpro/src/candidate-word-portability.js'
      - 'seb-evalpro/scripts/candidate-word-portability-smoke.js'
      - 'seb-evalpro/scripts/candidate-legacy-usb-private-smoke.js'
      - 'seb-evalpro/scripts/candidate-protected-download-smoke.js'
      - 'seb-evalpro/scripts/bilan-docx-smoke.js'
      - 'seb-evalpro/src/bilan-history-main.js'
      - 'seb-evalpro/src/bilan-history-preload.js'
      - 'seb-evalpro/src/candidate-bilan-current.js'
      - 'seb-evalpro/scripts/candidate-catalog-smoke.js'
      - 'seb-evalpro/src/candidate-protected-download.js'
      - 'seb-evalpro/src/bilan-docx-main.js'
      - 'seb-evalpro/src/candidate-catalog-preload.js'
      - 'seb-evalpro/scripts/candidate-historical-privacy-smoke.js'
      - 'seb-evalpro/scripts/candidate-private-transfer-smoke.js'
      - 'seb-evalpro/scripts/build21-admin-foundation-guard.js'
      - 'seb-evalpro/src/preload.js'
      - 'seb-evalpro/scripts/kaloneo-preview-resolution-r142-smoke.js'
      - 'seb-evalpro/scripts/kaloneo-builder-preview-electron-smoke-main.js'
      - 'seb-evalpro/scripts/kaloneo-responsive-overflow-electron-smoke-main.js'
      - 'seb-evalpro/scripts/kaloneo-layout-diagnostics-unit-smoke.js'
      - '.github/workflows/audit-r142-responsive-no-setup.yml'
  workflow_dispatch:
concurrency:
  group: kaloneo-r142-responsive-audit-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-no-regression:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - name: Guarantee released baseline and protected V1 untouched
        shell: pwsh
        run: |
          git fetch --depth=1 origin tag seb-kaloneo-r141-help-guides-test
          if($LASTEXITCODE -ne 0){throw 'R141 reference tag missing'}
          $p=Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          if([int]$p.sebBuildNumber -ne 149 -or $p.sebReleaseVersion -ne '0.0.173'){
            throw 'The audit must not publish or change a setup version'
          }
          foreach($file in (git diff --name-only seb-kaloneo-r141-help-guides-test HEAD)){
            if($file -match '^(TESTS_VALIDES/|VALID2/|seb-evalpro/source/kaltest/tests/|images_tests/|kaloneo/icons-tests/)'){
              throw "Protected V1 or image changed: $file"
            }
          }
          Write-Host 'R143 rollback remains; R144 version 0.0.173 Build #149 and validated V1 are intact'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and true/false overflow checks
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/kaloneo-layout-diagnostics.js
          node --check src/preload.js
          node --check ../kaloneo/test-builder.js
          node --check scripts/kaloneo-layout-diagnostics-unit-smoke.js
          node scripts/kaloneo-layout-diagnostics-unit-smoke.js
          node --check scripts/kaloneo-preview-resolution-r142-smoke.js
          node scripts/kaloneo-preview-resolution-r142-smoke.js
      - name: New test, questions, scoring, portability and prior templates
        shell: pwsh
        run: |
          node scripts/kaloneo-builder-future-roundtrip-smoke.js
          node scripts/kaloneo-answer-layout-roundtrip-smoke.js
          node scripts/kaloneo-units-score-audit-smoke.js
          node scripts/kaloneo-catalog-roundtrip-score-guard.js
          node scripts/kaloneo-free-text-height-r123-smoke.js
      - name: Prepare real application pages
        run: |
          node scripts/build-kaltest-pilot2-data.js
          npm run prepare:web
      - name: Images, edited tests, transfers and V1
        shell: pwsh
        run: |
          node scripts/kaloneo-image-library-smoke.js
          node scripts/kaloneo-image-export-ui-smoke.js
          node scripts/kaloneo-export-restaurant-r69-smoke.js
          node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Real Electron render across five sizes and clipping
        run: npx electron --no-sandbox scripts/kaloneo-responsive-overflow-electron-smoke-main.js
      - name: New Builder tests and interactive preview
        shell: pwsh
        run: |
          npx electron --no-sandbox scripts/kaloneo-new-test-preview-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'New test preview Electron failed'}
          npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Builder preview Electron failed'}
          npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Shared candidate columns Electron failed'}
      - name: Complete candidate parcours and results
        shell: pwsh
        run: |
          npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Selected parcours failed'}
          npx electron --no-sandbox scripts/kaloneo-results-strict-isolation-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Results isolation failed'}
          npx electron --no-sandbox scripts/kaloneo-results-readable-formats-electron-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Results formats failed'}
          npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
          if($LASTEXITCODE -ne 0){throw 'Full candidate journey failed'}
      - name: Security, candidate data, import and export
        run: |
          npm run test:security
          node scripts/candidate-private-transfer-smoke.js
          node scripts/candidate-forward-anonymity-smoke.js
          node scripts/candidate-deletion-index-privacy-smoke.js
          node scripts/replay-direct-candidate-storage-smoke.js
          node scripts/candidate-private-pending-smoke.js
          node scripts/candidate-protected-download-smoke.js
          node scripts/candidate-word-portability-smoke.js
          node scripts/candidate-legacy-usb-private-smoke.js
          node scripts/candidate-word-privacy-guard.js
          node scripts/candidate-historical-privacy-smoke.js
          node scripts/bilan-docx-smoke.js
      - name: No installer published
        shell: pwsh
        run: |
          Write-Host 'Audit completed; R143 0.0.172 Build #148 stays available as rollback; R144 requires Windows installer validation.'
