name: "KALONÉO — mot de passe obligatoire après licence (sans Release)"
on:
  push:
    branches: [fix-r186-kaltest-source-unique-20261027]
    paths:
      - ".github/workflows/audit-kaloneo-install-password.yml"
      - "seb-evalpro/build/installer.nsh"
      - "seb-evalpro/scripts/kaloneo-install-auth-build.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier-verrou-du-setup:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: seb-evalpro
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les ressources sans le secret réel
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
          if($LASTEXITCODE -ne 0){throw 'Pillow absent'}
          python scripts/kaloneo-r125-branding.py
          if($LASTEXITCODE -ne 0){throw 'Branding absent'}
          python scripts/r158-build-installer-intro.py
          if($LASTEXITCODE -ne 0){throw 'Animation absente'}
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Dépendances absentes'}
      - name: Génération sécurisée de l'empreinte (secret fictif uniquement)
        env:
          KALONEO_INSTALL_PASSWORD: 'MotDePasse-Fictif-Installation-CI-2026!'
        run: |
          node scripts/kaloneo-install-auth-build.js
          if($LASTEXITCODE -ne 0){throw 'Mot de passe de compilation absent'}
          if(-not (Test-Path build/pilot-resources/kaloneo-password-hash.nsh)){throw 'Empreinte absente'}
      - name: Préparer et compiler l'installateur NSIS de contrôle
        run: |
          $ErrorActionPreference='Stop'
          node scripts/build-kaltest-pilot2-data.js
          if($LASTEXITCODE -ne 0){throw 'KALTEST source impossible'}
          npm run prepare:web
          if($LASTEXITCODE -ne 0){throw 'Préparation programme impossible'}
          node scripts/kaloneo-nsis-directory-template.js
          if($LASTEXITCODE -ne 0){throw 'Template NSIS invalide'}
          & npx electron-builder --win nsis --config build/kaloneo-v1-00-190-final-setup.yml --publish never
          if($LASTEXITCODE -ne 0){throw 'Mot de passe NSIS : compilation impossible'}
      - name: Interdire /S sans secret ou avec mauvais secret, autoriser uniquement le bon
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path dist/KALONEO-Setup-1.00.190.exe).Path
          $target=Join-Path $env:LOCALAPPDATA 'Programs/KALONEO/KALONEO.exe'
          Remove-Item Env:KALONEO_INSTALL_PASSWORD -ErrorAction SilentlyContinue
          $without=Start-Process -FilePath $exe -ArgumentList @('/S','/currentuser') -PassThru -Wait
          if($without.ExitCode -eq 0){throw 'BYPASS : silent sans mot de passe est passé'}
          if(Test-Path $target){throw 'BYPASS : des fichiers ont été installés sans mot de passe'}
          $env:KALONEO_INSTALL_PASSWORD='Mauvais-mot-de-passe-123456'
          $wrong=Start-Process -FilePath $exe -ArgumentList @('/S','/currentuser') -PassThru -Wait
          if($wrong.ExitCode -eq 0){throw 'BYPASS : mauvais mot de passe accepté'}
          if(Test-Path $target){throw 'BYPASS : des fichiers ont été installés avec mauvais mot de passe'}
          $env:KALONEO_INSTALL_PASSWORD='MotDePasse-Fictif-Installation-CI-2026!'
          $good=Start-Process -FilePath $exe -ArgumentList @('/S','/currentuser') -PassThru -Wait
          Remove-Item Env:KALONEO_INSTALL_PASSWORD -ErrorAction SilentlyContinue
          if($good.ExitCode -ne 0){throw 'Mot de passe correct refusé (code '+$good.ExitCode+')'}
          if(-not(Test-Path $target)){throw 'KALONÉO absent après mot de passe valide'}
          Write-Host 'KALONEO_SETUP_PASSWORD_ENFORCED=SUCCESS; missing=rejected; wrong=rejected; valid=installed'
