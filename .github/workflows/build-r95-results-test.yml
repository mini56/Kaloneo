name: 'KALONÉO R95 - Setup de test visuel - Build 100'
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/build-r95-results-test.yml'
      - 'seb-evalpro/package.json'
      - 'seb-evalpro/build/installer.nsh'
      - 'seb-evalpro/build/kaloneo-v1-fixes-r95-results-test-builder.yml'
  workflow_dispatch:

concurrency:
  group: kaloneo-r95-setup-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tri-rearm:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout isolated Tri correction
        uses: actions/checkout@v4
      - name: Garantir un Build 100 neuf sans modifier la R91
        shell: pwsh
        run: |
          $p=Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $cfg=Get-Content -Raw -Encoding UTF8 build/kaloneo-v1-fixes-r95-results-test-builder.yml
          $nsis=Get-Content -Raw -Encoding UTF8 build/installer.nsh
          if ([int]$p.sebBuildNumber -ne 100) { throw 'Build #100 requis.' }
          if ($nsis -notmatch '!define SEB_BUILD_NUMBER "100"') { throw 'Numéro NSIS incoherent.' }
          if ($cfg -notmatch 'version: 0\.0\.124' -or $cfg -notmatch 'PILOTE-22-R95-0\.0\.124-Windows-Setup') { throw 'Version R95 incoherente.' }
          git fetch --depth=1 origin tag seb-kaloneo-r94-refonte-generique-test
          if ($LASTEXITCODE -ne 0) { throw 'Tag de la version test R94 absent.' }
          $oldJson=(git show 'seb-kaloneo-r94-refonte-generique-test:seb-evalpro/package.json') -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'R94 illisible.' }
          $old=$oldJson | ConvertFrom-Json
          if ([int]$p.sebBuildNumber -le [int]$old.sebBuildNumber) { throw 'Build deja utilise.' }
          $existing=git ls-remote --tags origin 'refs/tags/seb-kaloneo-r95-resultats-isoles-test'
          if ($LASTEXITCODE -ne 0 -or $existing) { throw 'R95 deja publiee ou remote indisponible.' }
          Write-Host 'R94 conservée, R95 Build #100 inédit.'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check restored Tri runtime and smoke syntax
        run: |
          node --check source/js/kaltest-pilot2-runtime.js
          node --check ../kaloneo/builder-core.js
          node --check ../kaloneo/test-preview.js
          node --check ../kaloneo/test-builder.js
          node --check scripts/kaloneo-builder-preview-electron-smoke-main.js
          node --check scripts/kaloneo-new-test-preview-electron-smoke-main.js
          node --check scripts/kaloneo-shared-html-candidate-electron-smoke-main.js
          node --check scripts/kaloneo-mini-preview-worker-lifecycle-smoke.js
          node --check scripts/kaloneo-builder-future-roundtrip-smoke.js
          node --check scripts/kaloneo-catalog-roundtrip-score-guard.js
          node --check scripts/kaloneo-results-strict-isolation-electron-smoke-main.js
          node --check source/js/qcm-runtime.js
          node --check source/js/admin-bilan-kaloneo.js
          node --check scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
          node --check scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: No offscreen Electron worker survives an image capture
        run: node scripts/kaloneo-mini-preview-worker-lifecycle-smoke.js
      - name: Check all 12 block types in new tests and canonical question scores
        run: node scripts/kaloneo-builder-future-roundtrip-smoke.js
      - name: Audit all catalog KALTESTs, scoring, outputs and embedded media
        run: node scripts/kaloneo-catalog-roundtrip-score-guard.js
      - name: Verify gallery contains test illustrations only, without deleting images
        run: |
          node --check ../kaloneo/image-library-gallery.js
          node --check ../kaloneo/test-builder.js
          node scripts/kaloneo-image-gallery-visibility-smoke.js
      - name: Verify Genre et nombre font persistence without changing original V1
        run: node scripts/kaloneo-genre-nombre-font-smoke.js
      - name: Generate historical KALTEST pilot data
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare authentic KALTEST candidate application
        run: npm run prepare:web
      - name: Verify Admin V1 save backups and persistence across app upgrades
        run: node scripts/kaloneo-testsv1-developer-smoke.js
      - name: Verify original V1 and V2 coexist without delete regression
        run: node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Verify V1 can be modified and saved in the real Electron Builder
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Check Tri first attempt error and next chrono in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
      - name: Check Briques 0-99 including 12/99 and Admin persistence in Electron
        run: npx electron --no-sandbox scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: Check full candidate parcours transitions in real Electron
        id: full_journey
        continue-on-error: true
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Check selected parcours execution in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js
      - name: Check validated NWTEXT exercise in real Electron
        run: npx electron --no-sandbox scripts/nwtexte-functional-smoke-main.js
      - name: Check e-mail exercise in real Electron
        run: npx electron --no-sandbox scripts/nvmail-functional-smoke-main.js
      - name: Prove that Mail scores cannot appear in another test or Bilan
        run: npx electron --no-sandbox scripts/kaloneo-results-strict-isolation-electron-smoke-main.js
      - name: Check dynamic evaluation results and Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-bilan-dynamic-smoke-main.js
      - name: Check validated Builder R48.10 auto columns in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js
      - name: Check synthetic HTML/JS in the real candidate Electron engine
        run: npx electron --no-sandbox scripts/kaloneo-shared-html-candidate-electron-smoke-main.js
      - name: Check novel KALTEST tables and image in standalone Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-new-test-preview-electron-smoke-main.js
      - name: Check test icons in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-candidate-icon-electron-smoke-main.js
      - name: Check preserved validated R48.10 / NWTEXT R55 / icons
        run: node scripts/kaloneo-consolidation-regression.js
      - name: Final gate - do not mask any full journey regression
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.full_journey.outcome }}' -ne 'success') {
            throw 'Parcours complet non valide : la publication reste bloquee, meme si les autres controles passent.'
          }
      - name: Compiler uniquement apres validation automatisee
        run: npx electron-builder --win nsis --config build/kaloneo-v1-fixes-r95-results-test-builder.yml --publish never

      - name: Calculer SHA256 du Setup R95
        shell: pwsh
        run: |
          $setup=Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R95-0.0.124-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup R95 manquant.' }
          $hash=(Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R95 Build #100: SHA256=$hash"

      - name: Fournir le Setup R95 comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-R95-Build-100-Setup
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R95-0.0.124-Windows-Setup.exe
          if-no-files-found: error

      - name: Publier une Release de test R95 sans remplacer R91
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='seb-kaloneo-r95-resultats-isoles-test'
          if (gh release view $tag 2>$null) { throw 'R95 existe deja. Refus de reutiliser Build #100.' }
          $title='SEB EvalPro Kaloneo - R95 / Build #100 - TEST DES RESULTATS NON VALIDE'
          $notes=@"
          R95 Build #100 / version 0.0.124 — ESSAI DES RESULTATS UNIQUEMENT.
          PRIORITE SECURITE DES EVALUATIONS.
          Le parcours candidat est celui de la R94, sans modification des exercices ni visuels.
          Les fiches Resultats ne recyclent plus d'anciens blocs des pages 2–8 :
          seules les donnees KALTEST portant exactement le meme identifiant de test sont lues.
          L'ordre et les categories proviennent uniquement du manifeste du parcours execute.
          Le Bilan n'ajoute plus un test seulement parce que des donnees historiques le mentionnent.
          Les notes ne sont jamais reconstituees a partir de pages historiques si les donnees
          canoniques du parcours sont indisponibles.
          Tests Electron avec resultats Mail, Inventaire, activite future et resultat parasite : VERTS.
          Un parcours reel sur le PC utilisateur DOIT etre controle avant toute evaluation officielle.
          NE PAS effacer les anciennes donnees de candidats ; les notes deja affichees dans R94
          doivent etre recontrolees a partir de cette nouvelle version.
          La R94 Build #99 et la R93 Build #98 restent disponibles independamment.
          Version de contrôle final du Builder après les visuels validés en R93.
          L'aperçu réel du candidat et les tests validés conservent leur présentation R93.
          Les processus de capture invisibles sont fermés après chaque image.
          Les anciennes captures obsolètes sont abandonnées pour limiter les tâches en arrière-plan.
          Les questions affichées simultanément dans une grille et un bloc ne sont plus dupliquées.
          Les barèmes canoniques sont préservés lors des allers-retours du Builder.
          Un audit automatique protège les 24 KALTEST actuels et leurs futures extensions.
          Ceci reste une version pour ESSAI sur PC : l'approbation visuelle et pratique
          finale des tests appartient à l'utilisateur.
          La R93 Build #98 reste disponible séparément comme dernier visuel accepté.
          L'application, les fichiers V1, leurs images et leurs barèmes ne sont pas édités par le build.
          Vérifier en priorité le Tri de chevilles : chrono, tableau de tris et autoévaluation.
          Durant la frappe, le Builder conserve un aperçu simplifié rapide et ne vole pas le focus.
          Les captures sont déclenchées par les changements, sans surveillance périodique.
          Les visuels candidats, tests V1, barèmes et images n'ont pas été modifiés.
          La R92 Build #97 est conservée comme point de comparaison.
          Attention : les presentations ne sont PAS toutes validees.
          Aucune V1 ni image validee n'a ete modifiee dans la refonte.
          Cette version contient les modifications des moteurs de presentation.
          Ne pas utiliser cette version pour une evaluation officielle avant validation.
          La R91 Build #96 reste disponible en secours.
          Commit : $env:GITHUB_SHA
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag "$env:SETUP_PATH" --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
