name: "KALONÉO — Nettoyage unique des anciens runs GitHub Actions"
on:
  # Nettoyage manuel uniquement : aucune purge sur un commit normal.
  workflow_dispatch:
    inputs:
      confirmer_suppression:
        description: "Supprimer jusqu'à 700 anciens runs non essentiels (irréversible)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: kaloneo-cleanup-once
  cancel-in-progress: false
jobs:
  nettoyage-controle:
    if: inputs.confirmer_suppression == true
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KALONEO_MAX_DELETE: '700'
      KALONEO_DRY_RUN: 'false'
    steps:
      - name: Recuperer la branche de KALONÉO sans changer les versions
        uses: actions/checkout@v4
      - name: Runtime Python pour suppression limitee
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditer, protéger les releases et nettoyer les runs anciens non essentiels
        run: python .github/scripts/prune-obsolete-runs.py
