name: "KALONEO — vérification nouvelle vidéo d'introduction"
on:
  push:
    branches: [fix-r60-tri-rearm-only-20261011]
    paths:
      - 'seb-evalpro/scripts/r170-check-intro-source.py'
      - '.github/workflows/audit-r170-intro-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - run: python seb-evalpro/scripts/r170-check-intro-source.py
