name: "KALONÉO — diagnostic du secret installateur (sans affichage du mot de passe)"
on:
  push:
    branches: [fix-r186-kaltest-source-unique-20261027]
    paths:
      - ".github/workflows/check-kaloneo-install-secret.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-status:
    runs-on: windows-latest
    steps:
      - name: Vérification de la présence et de la longueur autorisée du secret
        shell: pwsh
        env:
          KALONEO_INSTALL_PASSWORD: ${{ secrets.KALONEO_INSTALL_PASSWORD }}
        run: |
          $value = $env:KALONEO_INSTALL_PASSWORD
          if([string]::IsNullOrEmpty($value)){
            Write-Host 'KALONEO_INSTALL_SECRET_STATUS=MISSING_OR_NOT_ACCESSIBLE_IN_THIS_REPOSITORY'
          }elseif($value.Length -lt 12){
            Write-Host 'KALONEO_INSTALL_SECRET_STATUS=TOO_SHORT_MINIMUM_12_CHARACTERS'
          }elseif($value.Length -gt 120){
            Write-Host 'KALONEO_INSTALL_SECRET_STATUS=TOO_LONG_MAXIMUM_120_CHARACTERS'
          }elseif($value -match '[\x00-\x1f]'){
            Write-Host 'KALONEO_INSTALL_SECRET_STATUS=UNSUPPORTED_CONTROL_CHARACTER'
          }else{
            Write-Host 'KALONEO_INSTALL_SECRET_STATUS=VALID'
          }
