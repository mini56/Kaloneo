name: "KALONÉO R125 - Identité officielle et installation Windows - Build 130"
# Contrôle Admin adapté au nouveau nom de Setup sans changer les numéros.
# La V1 historique conserve ses adresses pédagogiques pendant le changement de marque.
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/build-r125-kaloneo-identity.yml'
concurrency:
  group: kaloneo-r125-setup-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows-kaloneo:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout existing unique working branch
        uses: actions/checkout@v4
      - name: Verify Build 130 is unique and V1 untouched
        shell: pwsh
        run: |
          git fetch --depth=1 origin tag seb-kaloneo-r124-responsive-overflow-test
          if ($LASTEXITCODE -ne 0) { throw 'R124 backup release not found' }
          $old=(git show 'seb-kaloneo-r124-responsive-overflow-test:seb-evalpro/package.json') -join [Environment]::NewLine | ConvertFrom-Json
          $p=Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          if ([int]$old.sebBuildNumber -ne 129 -or [int]$p.sebBuildNumber -ne 130 -or $p.sebReleaseVersion -ne '0.0.154') { throw 'Build reused or version inconsistent' }
          $existing=git ls-remote --tags origin refs/tags/seb-kaloneo-r125-identity-test
          if ($LASTEXITCODE -ne 0 -or $existing) { throw 'R125 release already exists, refusing Build reuse' }
          foreach($file in (git diff --name-only seb-kaloneo-r124-responsive-overflow-test HEAD)){
            if($file -match '^(TESTS_VALIDES/|VALID2/|seb-evalpro/source/kaltest/tests/|images_tests/|kaloneo/icons-tests/)'){throw "Protected V1 resource changed: $file"}
          }
          Write-Host 'R124 backup preserved, new Build 130 and V1 protection confirmed.'
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python for official Windows assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate authentic KALONÉO installer icon and wizard images
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/kaloneo-r125-branding.py
          if ($LASTEXITCODE -ne 0) { throw 'KALONEO artwork generation failed' }
      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax, previous regression and consistent build guards
        shell: pwsh
        run: |
          node --check scripts/kaloneo-r125-visible-branding.js
          node --check scripts/kaloneo-r125-branding-guard.js
          node --check ../kaloneo/test-builder.js
          node --check src/main.js
          node --check src/kaltest-pilot21-main.js
          node scripts/kaloneo-layout-diagnostics-unit-smoke.js
          node scripts/kaloneo-builder-future-roundtrip-smoke.js
          node scripts/kaloneo-answer-layout-roundtrip-smoke.js
          node scripts/kaloneo-catalog-roundtrip-score-guard.js
      - name: Prepare original complete candidate journey
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare application with KALONÉO branding
        run: npm run prepare:web
      - name: Validate visible identity on ALL generated screens
        run: node scripts/kaloneo-r125-branding-guard.js
      - name: Validate version and admin UI build consistency
        run: node scripts/admin-build-label-guard.js
      - name: New tests, units, images, export and V1
        shell: pwsh
        run: |
          node scripts/kaloneo-units-score-audit-smoke.js
          node scripts/kaloneo-image-library-smoke.js
          node scripts/kaloneo-image-export-ui-smoke.js
          node scripts/kaloneo-export-restaurant-r69-smoke.js
          node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Electron five screen resolutions and candidate content
        run: npx electron --no-sandbox scripts/kaloneo-responsive-overflow-electron-smoke-main.js
      - name: Electron Builder preview and input focus
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Electron novel questions with table and image
        run: npx electron --no-sandbox scripts/kaloneo-new-test-preview-electron-smoke-main.js
      - name: Electron strict results isolation
        run: npx electron --no-sandbox scripts/kaloneo-results-strict-isolation-electron-smoke-main.js
      - name: Electron readable results and bilan
        run: npx electron --no-sandbox scripts/kaloneo-results-readable-formats-electron-smoke-main.js
      - name: Electron full original candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Candidate import export and persistence
        run: npm run test:security
      - name: Build official KALONÉO Windows installer only after ALL green
        run: npx electron-builder --win nsis --config build/kaloneo-r125-identity.yml --publish never
      - name: Test clean install, upgrade from R124, shortcut, and preserved candidate files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup=Join-Path (Resolve-Path dist) 'KALONEO-Setup-0.0.154.exe'
          if (-not (Test-Path $setup)) { throw 'Expected official installer missing' }
          $tempRoot=Join-Path $env:RUNNER_TEMP 'kaloneo-r125-windows-install'
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          $oldDir=Join-Path $tempRoot 'previous'
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          gh release download seb-kaloneo-r124-responsive-overflow-test --dir $oldDir --pattern '*Windows-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous Windows installer for upgrade test' }
          $oldSetup=Get-ChildItem $oldDir -Filter '*.exe' | Select-Object -First 1
          if (-not $oldSetup) { throw 'Old R124 setup unavailable' }
          $install=Join-Path $tempRoot 'installation'
          $argsOld='/S /D='+$install
          $result=Start-Process -FilePath $oldSetup.FullName -ArgumentList $argsOld -Wait -PassThru
          if($result.ExitCode -ne 0){throw "R124 silent setup failed: $($result.ExitCode)"}
          $profileDir=Join-Path $env:APPDATA 'SEB EvalPro Kaloneo PILOTE 21'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          $sentinel=Join-Path $profileDir 'kaloneo-r125-upgrade-sentinel.txt'
          [IO.File]::WriteAllText($sentinel,'candidate-persistence-preserved')
          $result=Start-Process -FilePath $setup -ArgumentList ('/S /D='+$install) -Wait -PassThru
          if($result.ExitCode -ne 0){throw "R125 upgrade setup failed: $($result.ExitCode)"}
          if(-not (Test-Path $sentinel) -or [IO.File]::ReadAllText($sentinel) -ne 'candidate-persistence-preserved'){throw 'Candidate data LOST during upgrade'}
          $installed=Get-ChildItem $install -Filter '*KALON*.exe' -File | Where-Object {$_.Name -notmatch 'Uninstall'} | Select-Object -First 1
          if(-not $installed){throw 'KALONÉO.exe not installed with official product name'}
          $icon=[System.Drawing.Icon]::ExtractAssociatedIcon($installed.FullName)
          if(-not $icon){throw 'Installed KALONÉO app has no Windows icon'}
          Write-Host "KALONEO_INSTALL_UPGRADE_R125=OK — $($installed.Name), app icon and candidate sentinel preserved"
      - name: SHA256 setup
        shell: pwsh
        run: |
          $setup=Get-Item dist/KALONEO-Setup-0.0.154.exe
          $sha=(Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R125 Build #130 SHA256=$sha"
      - name: Attach Windows installer test artifact
        uses: actions/upload-artifact@v4
        with:
          name: KALONEO-R125-Build-130-Windows-Setup
          path: seb-evalpro/dist/KALONEO-Setup-0.0.154.exe
          if-no-files-found: error
      - name: Publish KALONÉO R125 TEST version after successful install and update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='seb-kaloneo-r125-identity-test'
          if (gh release view $tag 2>$null) { throw 'Build 130 already released' }
          $title='KALONÉO — R125 / Build #130 — Installateur officiel à tester'
          $notes=@"
          Version 0.0.154 — Build #130 — INSTALLATEUR KALONÉO DE TEST.
          - Nom, icône, raccourcis et écrans Windows KALONÉO.
          - Logo officiel KALONÉO et phrase d'accroche d'origine.
          - Anciennes marques SEB EvalPro / Sauvegarde 56 retirées des interfaces.
          - Identifiants techniques et anciens dossiers conservés pour la mise à jour.
          - Installation Windows, mise à jour R124, préservation des données et tests Electron contrôlés.
          - Aucune V1 ou ressource validée modifiée.
          - R124 Build #129 reste le point de secours.
          SHA256: $env:SETUP_SHA256
          Commit: $env:GITHUB_SHA
          "@
          gh release create $tag "$env:SETUP_PATH" --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
