name: Diagnostic Samsung KALONEO-RUNNERS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnostic-samsung-runner.yml'

permissions:
  contents: read

jobs:
  diagnostic-samsung:
    name: Verifier runner Samsung
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Connexion au runner attendu
        shell: cmd
        run: |
          echo Runner : %RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="KALONEO-RUNNERS" exit /b 1
          echo Runner KALONEO-RUNNERS connecte avec succes.

      - name: Inventaire des outils de compilation (sans installation)
        shell: cmd
        run: |
          for %%T in (git node npm python makensis) do (
            where %%T >nul 2>nul
            if errorlevel 1 (echo %%T : ABSENT) else (echo %%T : PRESENT)
          )
          echo Diagnostic termine. Aucun changement sur le PC.
