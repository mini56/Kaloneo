name: Installer 30 icônes KALONÉO en 96px R61
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/install-r61-icons-96.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install-icons:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow for clean 192-to-96 resampling
        run: python -m pip install "Pillow==11.3.0"
      - name: Fetch approved 192px preview files from main
        run: git fetch origin main
      - name: Create 30 icons of the exact original Kalonéo size 96x96
        run: python seb-evalpro/scripts/integrer-icones-96-r61.py
      - name: Verify every PNG size and 100 icon catalogue entries
        run: |
          node --check kaloneo/icon-library.js
          node --check kaloneo/test-builder.js
          node seb-evalpro/scripts/verify-r61-icons.js
      - name: Commit ONLY the icon library, selector and 30 96px icons
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kaloneo/icon-library.js kaloneo/test-builder.js kaloneo/icons-tests/
          git diff --cached --check
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -ne 33) { throw "33 fichiers attendus, trouves : $($changed.Count)" }
          foreach ($path in $changed) {
            if ($path -ne 'kaloneo/icon-library.js' -and $path -ne 'kaloneo/test-builder.js' -and -not $path.StartsWith('kaloneo/icons-tests/')) {
              throw "Fichier non autorise : $path"
            }
          }
          git commit -m "Integrate 30 approved test icons at native 96px; preserve existing 70"
          git push origin HEAD:fix-r60-tri-rearm-only-20261011
      - name: Launch Windows Setup R61
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-r61-windows.yml --repo mini56/SEB-EVAL-PRO-Kaloneo --ref fix-r60-tri-rearm-only-20261011
