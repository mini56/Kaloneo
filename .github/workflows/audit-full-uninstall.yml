name: "KALONÉO - Audit désinstallation complète"
on:
  # Vérification disponible à la demande ; contrôles automatisés réunis dans le Setup R177.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-uninstall-source:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strict NSIS uninstall policy and no collateral deletion
        run: node scripts/kaloneo-full-uninstall-policy.js
      - name: Existing clean installer integration guard
        run: node scripts/kaloneo-r126-install-path-guard.js
