name: 'Build Windows KALONÉO R91 — Build #96 Historique et activité périodique du Builder (branche existante)'
on:
  push:
    branches:
      - fix-r60-tri-rearm-only-20261011
    paths:
      - '.github/workflows/build-r91-windows.yml'
      - 'seb-evalpro/build/kaloneo-v1-fixes-r91-builder.yml'
      - 'seb-evalpro/build/installer.nsh'
      - 'seb-evalpro/package.json'
  workflow_dispatch:

# Conserver ce groupe pour les futurs Builds Windows.
concurrency:
  group: kaloneo-windows-setup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-r91:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - name: Checkout existing branch — Restaurant V1
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unique build gate — no duplicate of the previous published Setup
        shell: pwsh
        run: |
          $p = Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $number = [int]$p.sebBuildNumber
          $nsis = Get-Content -Raw -Encoding UTF8 build/installer.nsh
          $cfg = Get-Content -Raw -Encoding UTF8 build/kaloneo-v1-fixes-r91-builder.yml
          if ($number -ne 96) { throw "R91 doit être Build #96, trouvé #$number." }
          if ($nsis -notmatch '!define SEB_BUILD_NUMBER "96"') { throw 'Numéro NSIS différent de Build #96.' }
          if ($cfg -notmatch 'version: 0\.0\.120') { throw 'Version du paquet R91 incorrecte.' }
          if ($cfg -notmatch 'PILOTE-22-R91-0\.0\.120-Windows-Setup') { throw 'Nom du Setup incohérent.' }
          git fetch --depth=1 origin tag seb-kaloneo-v1-fixes-r90-test
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de lire le tag R90 pour garantir un build distinct.' }
          $previousJson = (git show 'seb-kaloneo-v1-fixes-r90-test:seb-evalpro/package.json') -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de comparer au Build R90.' }
          $previous = $previousJson | ConvertFrom-Json
          if ($number -le [int]$previous.sebBuildNumber) {
            throw "Build réutilisé ou régressif : R90 #$($previous.sebBuildNumber), R91 #$number."
          }
          Write-Host "Numéros validés : R90 Build #$($previous.sebBuildNumber), R91 Build #$number (0.0.120)."
      - name: Reject an already published R91 release
        shell: pwsh
        run: |
          $existing = git ls-remote --tags origin refs/tags/seb-kaloneo-v1-fixes-r91-test
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de vérifier les tags distants.' }
          if ($existing) { throw 'R91 est déjà publiée : arrêt pour éviter un deuxième Build #96.' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check restored Tri runtime and smoke syntax
        run: |
          node --check source/js/kaltest-pilot2-runtime.js
          node --check ../kaloneo/test-builder.js
          node --check src/preload.js
          node --check src/main.js
          node --check ../kaloneo/builder-legacy-table-preview.js
          node --check ../kaloneo/builder-organisation-preview.js
          node --check ../kaloneo/bilan-catalog.js
          node --check scripts/kaloneo-builder-preview-electron-smoke-main.js
          node --check scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
          node --check scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: Verify 100 icons in native 96px format
        run: node scripts/verify-r61-icons.js
      - name: Check gallery filters without changing any stored image
        run: |
          node --check ../kaloneo/image-library-gallery.js
          node --check ../kaloneo/test-builder.js
          node scripts/kaloneo-image-gallery-visibility-smoke.js
      - name: Verify shared image controls and PC import source syntax
        run: |
          node --check ../kaloneo/builder-core.js
          node --check ../kaloneo/test-preview.js
          node --check ../kaloneo/test-builder.js
          node --check scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Genre et nombre - preserve legacy font settings and original V1
        run: node scripts/kaloneo-genre-nombre-font-smoke.js
      - name: Generate historical KALTEST pilot data
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare authentic KALTEST candidate application
        run: npm run prepare:web
      - name: Verify common CSS button styles are bundled (no app behavior change)
        shell: pwsh
        run: |
          if (-not (Test-Path 'app/web/css/seb-button-styles.css')) { throw 'Style commun des boutons non embarqué.' }
          $base = Get-Content -Raw -Encoding UTF8 'app/web/css/seb-design-system.css'
          $legacy = Get-Content -Raw -Encoding UTF8 'app/web/css/kaloneo-remaining-pages.css'
          if ($base -notmatch 'seb-button-styles\.css' -or $legacy -notmatch 'seb-button-styles\.css') { throw 'Import CSS commun manquant.' }
      - name: Verify Admin V1 save backups and persistence across app upgrades
        run: node scripts/kaloneo-testsv1-developer-smoke.js
      - name: Check Restaurant export includes the images from installed app/web
        run: node scripts/kaloneo-export-restaurant-r69-smoke.js
      - name: Verify Restaurant v3 promoted to official V1 and upgrade migration
        run: node scripts/kaloneo-restaurant-v1-r70-smoke.js
      - name: Verify original V1 and V2 coexist without delete regression
        run: node scripts/kaloneo-edit-existing-test-smoke.js
      - name: Verify V1 can be modified and saved in the real Electron Builder
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js
      - name: Verify edited Restaurant instructions in the actual candidate runtime
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-4-real-preview-electron-smoke-main.js
      - name: Check Tri first attempt error and next chrono in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-tri-rearm-r60-electron-smoke-main.js
      - name: Check 125+ Briques errors and admin save in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-brique-errors-r61-electron-smoke-main.js
      - name: Check full candidate parcours transitions in real Electron
        id: full_journey
        continue-on-error: true
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Check selected parcours execution in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js
      - name: Check validated NWTEXT exercise in real Electron
        run: npx electron --no-sandbox scripts/nwtexte-functional-smoke-main.js
      - name: Check e-mail exercise in real Electron
        run: npx electron --no-sandbox scripts/nvmail-functional-smoke-main.js
      - name: Check dynamic evaluation results and Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-bilan-dynamic-smoke-main.js
      - name: Check validated Builder R48.10 auto columns in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-r48-10-generic-columns-electron-smoke-main.js
      - name: Check test icons in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-candidate-icon-electron-smoke-main.js
      - name: Check preserved validated R48.10 / NWTEXT R55 / icons
        run: node scripts/kaloneo-consolidation-regression.js
      - name: Final gate - do not mask any full journey regression
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.full_journey.outcome }}' -ne 'success') {
            throw 'Parcours complet non valide : la publication reste bloquee, meme si les autres controles passent.'
          }
      - name: Build Windows Setup R91
        run: npx electron-builder --win nsis --config build/kaloneo-v1-fixes-r91-builder.yml --publish never

      - name: Verify R91 Setup and calculate SHA256
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R91-0.0.120-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup R91 introuvable apres compilation.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R91 Setup : $($setup.Name) SHA256=$hash"

      - name: Upload R91 Setup as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R91-Windows-Setup
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R91-0.0.120-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release R91 (do not overwrite previous releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-v1-fixes-r91-test'
          $title = 'SEB EvalPro Kalonéo — R91 / Build #96 — Historique et activité périodique du Builder — TEST'
          if (gh release view $tag 2>$null) {
            throw 'Release R91 deja presente : ne pas ecraser une release existante.'
          }
          $notes = @"
          R91 VERSION DE TEST - Build #96 / version 0.0.120. Basée sur R90, même branche.
          - Annuler et Rétablir restent utilisables après l'aller-retour vers l'Aperçu Electron ; la pile d'historique et les images restent dans la mémoire du processus principal pendant l'aperçu.
          - Maintien des blocs et du Bilan repliés, du texte, des images et du retour au même test.
          - Suppression de l'intervalle de vérification de sauvegarde toutes les 5 secondes sur les pages de conception (Builder et parcours). La sauvegarde automatique des véritables candidats reste active.
          - Tests Electron spécifiques : deux éditions avant l'aperçu, retour, Annuler, puis Rétablir avec résultats vérifiés.
          - Tous les contrôles existants de non-régression : V1, Organisation V1/V2, Tri, Briques, Restaurant, NWTEXT, Mail, résultats, Bilan et parcours complet.
          - Aucun test V1 validé ni ressource image d'origine modifiés.
          SHA256 Setup : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target $env:GITHUB_SHA --title $title --notes $notes
