appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot22
# Identifiant Windows historique conservé pour mises à jour, désinstallation et données.
productName: "KALONÉO"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot21-main.js
  version: 0.0.154

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/pilot-resources/kaloneo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "KALONÉO"
  installerIcon: build/pilot-resources/kaloneo.ico
  uninstallerIcon: build/pilot-resources/kaloneo.ico
  installerHeader: build/pilot-resources/installerHeader.bmp
  installerSidebar: build/pilot-resources/installerSidebar.bmp
  uninstallerSidebar: build/pilot-resources/installerSidebar.bmp
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  artifactName: "KALONEO-Setup-0.0.154.${ext}"
