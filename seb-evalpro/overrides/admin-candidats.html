<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KALONÉO — Espace administrateur</title>
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100vh;font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
    body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:70px 24px 24px}
    main{width:min(900px,92vw);min-height:min(620px,calc(100vh - 120px));background:#fff;border:1px solid #d8dde8;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:34px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    h1{margin:0 0 28px;color:#0070c0;font-size:26px}
      #seb-admin-home-program-image{display:block;width:min(560px,36vw);max-width:72%;max-height:42vh;height:auto;object-fit:contain;margin:0 auto;user-select:none;-webkit-user-drag:none}
    #seb-candidate-start{display:none;margin:20px auto 0;padding:13px 24px;background:#fff;border:1px solid #176690;color:#07517c;font:700 16px "Segoe UI",Arial,sans-serif;border-radius:11px;box-shadow:0 3px 9px rgba(0,55,86,.16);cursor:pointer}
    #seb-candidate-start:hover{background:#eaf6fc;border-color:#07517c}
    #seb-candidate-start:focus-visible{outline:3px solid #6abde3;outline-offset:2px}
    body.candidate-welcome #seb-candidate-start{display:block}
  </style>
<link rel="stylesheet" href="css/seb-in-app-alert.css" id="seb-evalpro-in-app-alert-css">
</head>
<body>
  <main>
    <h1 id="seb-welcome-title">Espace administrateur</h1>
    <img id="seb-admin-home-program-image" src="assets/kaloneo-logo-app.png" alt="KALONÉO — Au cœur d’un nouvel élan.">
    <button id="seb-candidate-start" type="button">Débuter le parcours</button>
  </main>
<script src="js/seb-in-app-alert.js" id="seb-evalpro-in-app-alert-script"></script>
<script src="js/seb-visual-branding.js" id="seb-evalpro-visual-branding"></script>

<script src="js/kaloneo-candidate-welcome.js" id="kaloneo-candidate-welcome-script"></script>
<script id="seb-ui-runtime-loader" src="js/seb-ui-runtime.js"></script>
</body>
</html>
