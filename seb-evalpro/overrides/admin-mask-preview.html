<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KALONÉO — Aperçu écran de masquage</title>
  <link rel="stylesheet" href="css/admin-mask-preview.css">
</head>
<body>
  <main id="mask-preview-root" class="mask-preview-root" aria-label="Aperçu réel de l’écran de masquage">
    <div id="mask-preview-content" class="mask-preview-content">
      <div id="mask-preview-media-stage" class="mask-media-stage" hidden>
        <video id="mask-preview-video" muted playsinline preload="auto" hidden></video>
        <img id="mask-preview-image" alt="" hidden>
      </div>
      <div id="mask-preview-text" class="mask-preview-text" hidden></div>
    </div>
    <button id="mask-preview-close" type="button">Masquer l’écran d’accueil</button>
  </main>
  <script src="js/kaloneo-mask-media.js"></script>
  <script src="js/admin-mask-preview.js"></script>
</body>
</html>
